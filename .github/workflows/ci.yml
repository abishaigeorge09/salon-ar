name: CI
on: [push, pull_request]

jobs:
  invariants:
    # Runs on Linux because none of these checks need Xcode: they are source-level
    # greps, the registry integrity check, and the meta-check that proves each one
    # bites. The device-only AR tests deliberately cannot run in CI at all, which is
    # recorded in docs/DEBT.md rather than faked with a simulator run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Confirmations registry, product invariants, security invariants
        run: ./scripts/dod.sh --quick
      - name: Prove every active check still bites
        run: ./scripts/verify-checks-bite.sh

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # .xcodeproj is generated by XcodeGen from the committed project.yml and is
      # gitignored. An earlier version of this job checked for ./*.xcodeproj, never found
      # one, printed "nothing to build" and passed — a vacuous green, which is the exact
      # failure this whole enforcement layer exists to prevent.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and run the full DoD
        run: |
          xcodegen generate
          ls -d ./*.xcodeproj    # fail loudly if generation produced nothing
          ./scripts/dod.sh
